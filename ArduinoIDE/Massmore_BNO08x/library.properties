sentence=Driver for the Massmore BNO085 / BNO086 9-axis sensor fusion IMU module (SKU-1010).
paragraph=Independent SH-2 / SHTP implementation over I2C, SPI and UART, plus UART-RVC. Simple blocking API and non-blocking FSM API, chip identity and authenticity verification, calibration, tare, FRS access and power management. No external dependencies, no dynamic allocation, no hardcoded pins. Supported: ESP32, ESP32-S3 (Arduino-ESP32 Core 3.x+) and AVR ATmega328P (Arduino Nano).
