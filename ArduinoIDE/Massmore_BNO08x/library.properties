sentence=Complete driver for the BNO085 / BNO086 9-axis sensor fusion IMU.
paragraph=Full SH-2 / SHTP implementation over I2C, SPI and UART, plus UART-RVC. Every sensor report from basic quaternions to the personal activity classifier and the 1 kHz gyro-integrated rotation vector. Includes chip identity and authenticity verification, calibration, tare, FRS access and power management. No external dependencies, no dynamic allocation. Tested on esp32 Arduino core 3.x, AVR, SAMD, RP2040 and STM32.
