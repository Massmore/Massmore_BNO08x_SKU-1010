; Massmore_BNO08x — PlatformIO multi-target project
; เปิดโฟลเดอร์นี้ใน VS Code แล้ว Build ได้ทันที ไม่ต้องติดตั้งอะไรเพิ่ม
;
; src/main.cpp = ตัวอย่าง 07_Factory_Test (เหมือนกับ ArduinoIDE/.../examples/07_Factory_Test)
; ต้องการลองตัวอย่างอื่น: copy เนื้อหา .ino จาก ArduinoIDE/Massmore_BNO08x/examples/<ชื่อ>/
; มาทับ src/main.cpp แล้วเติม #include <Arduino.h> บรรทัดแรก

[platformio]
default_envs = esp32dev
src_dir = src
lib_dir = lib

[env]
framework = arduino
monitor_speed = 115200
build_flags = -Wall -Wextra
; ไลบรารีถูก vendor ไว้ใน lib/Massmore_BNO08x แล้ว — ไม่ใช้ lib_deps จาก registry

; ---------- ESP32 family: pin pioarduino เพื่อให้ได้ Arduino-ESP32 Core 3.x ----------
; 55.03.311 = Arduino-ESP32 Core 3.3.11 (ทดสอบผ่านแล้ว) — ดูรุ่นอื่นได้ที่
; https://github.com/pioarduino/platform-espressif32/releases
[esp32_common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
upload_speed = 921600          ; ค่าหลักสำหรับ Mac
; upload_speed = 512000        ; ทางเลือก ถ้าอัพโหลดไม่นิ่ง
; upload_speed = 460800        ; ทางเลือก ถ้ายังไม่นิ่ง
monitor_filters = esp32_exception_decoder

[env:esp32dev]
extends = esp32_common
board = esp32dev

[env:esp32-s3-devkitc-1]
extends = esp32_common
board = esp32-s3-devkitc-1
build_flags = ${env.build_flags} -DARDUINO_USB_CDC_ON_BOOT=1

; ---------- AVR: Arduino Nano (ATmega328P) ----------
[env:nano]
platform = atmelavr
board = nanoatmega328new     ; Nano ที่ใช้ bootloader ใหม่ (115200) — บอร์ดส่วนใหญ่ในปัจจุบัน
build_flags = -Wall          ; ไม่ใส่ -Wextra: Arduino AVR core (new.cpp) เองพิมพ์ unused-parameter warning ไลบรารีนี้ build clean ทั้ง -Wall -Wextra
; board = nanoatmega328      ; ทางเลือก: Nano ที่ใช้ bootloader เก่า (57600) ถ้าอัพโหลดไม่ขึ้น
