; ============================================================================
;  Massmore BNO08x — PlatformIO project
;  https://www.massmore.shop
;
;  โปรเจกต์นี้พร้อมใช้งานทันที: เปิดโฟลเดอร์นี้ใน VS Code แล้วกด Upload ได้เลย
;  This project is ready to run: open the folder in VS Code and press Upload.
;
;  เปลี่ยนตัวอย่าง: copy ไฟล์จาก examples/<ชื่อ>/main.cpp มาทับ src/main.cpp
;  To try another example: copy examples/<name>/main.cpp over src/main.cpp
; ============================================================================

[platformio]
default_envs = esp32dev
src_dir      = src

; ---------------------------------------------------------------------------
;  IMPORTANT — Arduino ESP32 core 3.x
;
;  The official "platform = espressif32" package on the PlatformIO registry
;  still ships Arduino core 2.0.17 (as of platform v7.1.0). Arduino core 3.x —
;  which is what the Arduino IDE installs today — comes from the pioarduino
;  community fork, pinned below.
;
;  แพลตฟอร์ม espressif32 ตัวทางการของ PlatformIO ยังใช้ Arduino core 2.0.17
;  ถ้าต้องการ core 3.x (แบบเดียวกับที่ Arduino IDE ลงให้) ต้องใช้ pioarduino
;  ตามที่ pin ไว้ข้างล่างนี้
;
;  55.03.311 -> Arduino ESP32 core 3.3.11
;  ดูเวอร์ชันอื่นได้ที่ https://github.com/pioarduino/platform-espressif32/releases
; ---------------------------------------------------------------------------

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time

build_flags =
    -Wall
    -DCORE_DEBUG_LEVEL=1
    ; ขยาย buffer ของ SHTP ถ้าต้องการ batching เยอะ ๆ (ค่าเริ่มต้น 300)
    ; -DMASSMORE_BNO08X_MAX_PACKET=512

; ---------------------------------------------------------------------------
;  Boards. เลือกอันที่ตรงกับบอร์ดของคุณ แล้วตั้งเป็น default_envs ด้านบน
; ---------------------------------------------------------------------------

[env:esp32dev]                 ; ESP32 คลาสสิก (DevKitC, WROOM-32)
board = esp32dev

[env:esp32-s3-devkitc-1]       ; ESP32-S3
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32-s2-saola-1]         ; ESP32-S2
board = esp32-s2-saola-1

[env:esp32-c3-devkitm-1]       ; ESP32-C3 (RISC-V)
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32-c6-devkitc-1]       ; ESP32-C6
board = esp32-c6-devkitc-1
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ---------------------------------------------------------------------------
;  ไลบรารีนี้ไม่ผูกกับ ESP32 — ใช้กับบอร์ดอื่นได้ด้วย
;  The library is not ESP32-specific. Uncomment to build for other targets.
; ---------------------------------------------------------------------------

